<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xerxes</title>
<meta name="description" content="مدیریت و برنامه‌ریزی">
<meta name="theme-color" content="#F5F6F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1210" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Xerxes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="app.css">
<script>try{var t=localStorage.getItem('x-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>
<header class="head" id="head">
  <div class="wrap">
    <div class="top">
      <div class="brand"><img src="icons/icon.svg" alt=""><span>Xerxes</span></div>
      <nav class="tabs" id="tabs" aria-label="ناوبری اصلی"></nav>
      <button class="sync" id="sync" type="button" data-act="sync" title="همگام‌سازی اکنون"><i></i><span class="t">…</span></button>
      <button class="iconbtn" id="gear" type="button" data-act="settings" aria-label="تنظیمات"></button>
    </div>
    <div class="cap" id="cap"></div>
  </div>
</header>
<main id="view" class="wrap"></main>
<nav class="bnav" id="bnav" aria-label="ناوبری اصلی"></nav>
<div id="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="tip" class="tip" hidden></div>
<script src="vendor/qrcode.min.js" defer></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
